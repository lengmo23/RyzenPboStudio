Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=Поочерёдно нагружает каждое ядро и измеряет частоту / эффективную частоту / напряжение при текущем CO
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=Устанавливает начальный CO для всех ядер (0 по умолчанию; настраивается при повышенном BCLK) и измеряет частоту и напряжение каждого ядра; в каждом CCD ядро с наивысшим CPPC и минимальным напряжением на той же частоте выбирается эталоном, и CO пошагово снижается для выравнивания напряжений\nЗатем снижает CO по CCD для поиска плато одноядерной частоты, перепроверяет все ядра и подстраивает отстающие; ядра с ошибками вычислений откатываются и больше не снижаются
Voltage Alignment=Выравнивание напряжения
