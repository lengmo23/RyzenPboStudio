Note=Примечание
[Read before starting]\n=[Прочтите перед запуском]\n
· Save your documents and work and close programs you don't need. The PC may freeze during the test and unsaved data will be lost;\n=· Сохраните документы и закройте ненужные программы. Во время теста ПК может зависнуть, а несохранённые данные — пропасть;\n
· Close browsers, games, downloaders and other background programs, and pause Windows Update, antivirus scans and other background tasks;\n=· Закройте браузеры, игры, загрузчики и фоновые приложения, а также приостановите Центр обновления Windows, антивирусные проверки и другие фоновые задачи;\n
· Do not use the PC during the test. Any extra load disturbs the single-core measurement and skews the results.\n\n=· Не пользуйтесь ПК во время теста. Любая лишняя нагрузка мешает одноядерным замерам и искажает результаты.\n\n
Voltage Alignment runs these steps automatically:\n=Выравнивание напряжения автоматически выполнит следующие шаги:\n
1. Set every core's CO to the start CO below, CS unchanged;\n=1. Установит для всех ядер начальный CO, указанный ниже (CS без изменений);\n
1. Set every core's CO to 0, CS unchanged;\n=1. Сбросит CO всех ядер в 0 (CS без изменений);\n
2. Run Single Core Boost to record each core's frequency and voltage, and pick a reference core per CCD;\n=2. Выполнит одноядерный тест для замера частоты и напряжения каждого ядра и выберет эталонное ядро на каждый CCD;\n
3. Voltage alignment: lower CO step by step on cores above the reference core until they converge to it (up to {0} rounds);\n=3. Выравнивание напряжения: пошагово снизит CO на ядрах с напряжением выше эталонного до схождения (до {0} раундов);\n
4. Frequency alignment: lower CO per CCD to find the single-core frequency plateau, re-measure all cores, then fine-tune cores that run low.\n=4. Выравнивание частоты: снизит CO по CCD для поиска плато одноядерной частоты, перепроверит все ядра и подстроит отстающие.\n
Takes up to about {0} min.=Займёт до ~{0} мин.
[About the result]\n=[О результате]\n
· Voltage Alignment evens out the cores' single-core voltages; it does not find each core's CO limit;\n=· Выравнивание напряжения уравнивает напряжения ядер под одноядерной нагрузкой, а не ищет предел CO каждого ядра;\n
· The result reflects voltages under the single-core test load; all-core load and daily use need different voltages;\n=· Результат отражает напряжение под одноядерной тестовой нагрузкой; для многоядерной нагрузки и повседневных задач требуются иные напряжения;\n
· Starting from the result, raise or lower the CO of all cores based on stress tests and real use.=· Отталкиваясь от полученного результата, повышайте или понижайте CO всех ядер по итогам стресс-тестов и реального использования.
[Risk notice]\n=[Предупреждение о рисках]\n
· Voltage Alignment writes CO to the CPU; too low a voltage can make the system unstable or freeze. The CO written here is lost after a restart;\n=· Выравнивание напряжения записывает CO в CPU; слишком низкое напряжение может вызвать нестабильность или зависание. Записанный здесь CO сбрасывается после перезагрузки;\n
· The result is based on single-core measurements only and is not verified for stability; stress test it before saving;\n=· Результат основан только на одноядерных замерах и не проверен на стабильность; проведите стресс-тест перед сохранением;\n
· The result is filled into the CO editor and is not saved automatically;\n=· Результат подставляется в редактор CO и не сохраняется автоматически;\n
· Undervolting and overclocking carry hardware risk; you are responsible for any data loss or hardware damage.=· Андервольтинг и разгон связаны с риском для оборудования; ответственность за потерю данных или повреждение железа лежит на пользователе.
\n\nNote: an interrupted stress test was found. When a test starts later, it continues from this result with every core backed off by {0} steps.=\n\nПримечание: обнаружен прерванный стресс-тест. При последующем запуске тест продолжится от этого результата с откатом каждого ядра на {0} шагов.
Core BCLK is {0:F2} MHz. With a raised BCLK some cores may need a positive CO to be stable, so enter a start CO: alignment starts with every core at this value and never ends above it; with a start above 0 each step lowers CO by at most {1}. The default is the highest positive CO now in effect.=Обнаружена частота BCLK {0:F2} МГц. При повышенной BCLK некоторым ядрам для стабильности может потребоваться положительный CO — задайте начальный CO: выравнивание начнётся с этого значения на всех ядрах и не превысит его; при старте выше 0 шаг снижения ограничен {1}. По умолчанию подставлен максимальный активный положительный CO.
