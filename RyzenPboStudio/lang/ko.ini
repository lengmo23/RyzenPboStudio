[Read before starting]\n=[시작 전 필독]\n
· Save your documents and work and close programs you don't need. The PC may freeze during the test and unsaved data will be lost;\n=· 작업 중인 문서를 저장하고 불필요한 프로그램을 닫으세요. 테스트 중 프리징이 발생하면 저장하지 않은 데이터가 유실될 수 있습니다.\n
· Close browsers, games, downloaders and other background programs, and pause Windows Update, antivirus scans and other background tasks;\n=· 브라우저, 게임, 다운로더 등 백그라운드 프로그램을 종료하고 Windows 업데이트 및 백신 검사 같은 백그라운드 작업을 일시 중지하세요.\n
· Do not use the PC during the test. Any extra load disturbs the single-core measurement and skews the results.\n\n=· 테스트 중에는 PC를 조작하지 마세요. 추가 부하가 발생하면 싱글 코어 측정이 방해받아 결과가 왜곡됩니다.\n\n
Voltage Alignment runs these steps automatically:\n=전압 정렬은 다음 단계를 자동으로 실행합니다:\n
1. Set every core's CO to the start CO below, CS unchanged;\n=1. 모든 코어의 CO를 아래 시작 CO 값으로 통일합니다 (CS 유지).\n
1. Set every core's CO to 0, CS unchanged;\n=1. 모든 코어의 CO를 0으로 초기화합니다 (CS 유지).\n
2. Run Single Core Boost to record each core's frequency and voltage, and pick a reference core per CCD;\n=2. 싱글 코어 측정을 실행해 각 코어의 클럭과 전압을 기록하고 CCD별 기준 코어를 선정합니다.\n
3. Voltage alignment: lower CO step by step on cores above the reference core until they converge to it (up to {0} rounds);\n=3. 전압 정렬: 기준 코어보다 전압이 높은 코어의 CO를 단계적으로 낮춰 기준 코어에 수렴시킵니다 (최대 {0}라운드).\n
4. Frequency alignment: lower CO per CCD to find the single-core frequency plateau, re-measure all cores, then fine-tune cores that run low.\n=4. 클럭 정렬: CCD 단위로 CO를 일괄 낮춰 싱글 코어 클럭 정점을 찾고 전체 코어를 재측정한 뒤 클럭이 낮은 코어를 미세 조정합니다.\n
Takes up to about {0} min.=최대 약 {0}분 소요됩니다.
[About the result]\n=[결과 안내]\n
· Voltage Alignment evens out the cores' single-core voltages; it does not find each core's CO limit;\n=· 전압 정렬은 싱글 코어 부하에서 코어 간 전압 편차를 줄이는 작업이며 각 코어의 한계 CO를 찾는 과정이 아닙니다.\n
· The result reflects voltages under the single-core test load; all-core load and daily use need different voltages;\n=· 결과는 싱글 코어 테스트 부하 기준의 전압이므로 올코어 부하나 실사용에서 필요한 전압과는 다를 수 있습니다.\n
· Starting from the result, raise or lower the CO of all cores based on stress tests and real use.=· 정렬 결과를 기준으로 안정성 테스트 및 실사용 결과에 따라 전체 코어 CO를 일괄 높이거나 낮춰 조정하세요.
[Risk notice]\n=[위험 고지]\n
· Voltage Alignment writes CO to the CPU; too low a voltage can make the system unstable or freeze. The CO written here is lost after a restart;\n=· 전압 정렬 중 CPU에 CO를 적용하므로 전압이 너무 낮으면 시스템이 불안정해지거나 프리징될 수 있습니다. 여기서 쓴 CO는 재부팅 후 초기화됩니다.\n
· The result is based on single-core measurements only and is not verified for stability; stress test it before saving;\n=· 결과는 싱글 코어 측정만 기반으로 하며 안정성 검증을 거치지 않았으므로 저장 전 반드시 안정성 테스트를 진행하세요.\n
· The result is filled into the CO editor and is not saved automatically;\n=· 결과는 CO 편집기에 입력되며 자동 저장되지 않습니다.\n
· Undervolting and overclocking carry hardware risk; you are responsible for any data loss or hardware damage.=· 언더볼팅과 오버클럭에는 하드웨어 위험이 따르며 데이터 손실 및 하드웨어 손상에 대한 책임은 사용자에게 있습니다.
\n\nNote: an interrupted stress test was found. When a test starts later, it continues from this result with every core backed off by {0} steps.=\n\n참고: 중단된 안정성 테스트 기록이 있습니다. 이후 테스트를 시작하면 이번 정렬 결과를 기준으로 모든 코어를 {0}단계 완화하여 이어서 진행합니다.
Core BCLK is {0:F2} MHz. With a raised BCLK some cores may need a positive CO to be stable, so enter a start CO: alignment starts with every core at this value and never ends above it; with a start above 0 each step lowers CO by at most {1}. The default is the highest positive CO now in effect.=코어 BCLK가 {0:F2} MHz로 감지되었습니다. BCLK가 높아지면 일부 코어는 안정화를 위해 양수 CO가 필요할 수 있으므로 시작 CO를 입력하세요. 정렬은 모든 코어를 이 값으로 설정해 시작하며 이 값을 초과하지 않습니다. 시작 값이 0보다 크면 한 단계당 최대 {1}씩 낮춥니다. 기본값은 현재 적용된 양수 CO 중 최댓값입니다.
