Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=각 코어에 싱글 코어 부하를 걸어 현재 CO에서의 클럭 / 유효 클럭 / 전압을 측정합니다
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=모든 코어의 CO를 시작 값(기본값 0, BCLK 상승 감지 시 지정 가능)으로 설정해 각 코어의 클럭과 전압을 측정한 뒤, CCD별로 CPPC 최상위 코어 중 동일 클럭에서 전압이 가장 낮은 코어를 기준으로 삼아 단계적으로 CO를 낮춰 전압을 정렬합니다\n이후 CCD 단위로 CO를 일괄 낮춰 싱글 코어 클럭 정점을 찾고 전체 코어를 재측정해 클럭이 낮은 코어를 미세 조정합니다. 연산 오류가 발생한 코어는 완화 후 더 이상 낮추지 않습니다
