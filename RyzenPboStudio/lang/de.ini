[Read before starting]\n=[Vor dem Start lesen]\n
· Save your documents and work and close programs you don't need. The PC may freeze during the test and unsaved data will be lost;\n=· Speichere deine Dokumente und Arbeit und schließe nicht benötigte Programme. Der PC kann während des Tests einfrieren und ungespeicherte Daten gehen verloren;\n
· Close browsers, games, downloaders and other background programs, and pause Windows Update, antivirus scans and other background tasks;\n=· Schließe Browser, Spiele, Download-Manager und andere Hintergrundprogramme und pausiere Windows Update, Virenscans sowie weitere Hintergrundaufgaben;\n
· Do not use the PC during the test. Any extra load disturbs the single-core measurement and skews the results.\n\n=· Benutze den PC während des Tests nicht. Jede zusätzliche Last stört die Einzelkern-Messung und verfälscht die Ergebnisse.\n\n
Voltage Alignment runs these steps automatically:\n=Der Spannungsabgleich führt folgende Schritte automatisch aus:\n
1. Set every core's CO to the start CO below, CS unchanged;\n=1. CO aller Kerne auf den untenstehenden Start-CO setzen, CS bleibt unverändert;\n
1. Set every core's CO to 0, CS unchanged;\n=1. CO aller Kerne auf 0 setzen, CS bleibt unverändert;\n
2. Run Single Core Boost to record each core's frequency and voltage, and pick a reference core per CCD;\n=2. Einzelkern-Messung ausführen, um Takt und Spannung jedes Kerns zu erfassen und je CCD einen Referenzkern zu bestimmen;\n
3. Voltage alignment: lower CO step by step on cores above the reference core until they converge to it (up to {0} rounds);\n=3. Spannungsabgleich: CO bei Kernen über dem Referenzkern schrittweise absenken, bis sie sich annähern (bis zu {0} Runden);\n
4. Frequency alignment: lower CO per CCD to find the single-core frequency plateau, re-measure all cores, then fine-tune cores that run low.\n=4. Taktabgleich: CO je CCD absenken, um das Einzelkern-Taktplateau zu finden, alle Kerne neu messen und langsamere Kerne feinjustieren.\n
Takes up to about {0} min.=Dauert höchstens ca. {0} Min.
[About the result]\n=[Zum Ergebnis]\n
· Voltage Alignment evens out the cores' single-core voltages; it does not find each core's CO limit;\n=· Der Spannungsabgleich gleicht die Einzelkern-Spannungen der Kerne an; er ermittelt nicht das CO-Limit jedes Kerns;\n
· The result reflects voltages under the single-core test load; all-core load and daily use need different voltages;\n=· Das Ergebnis spiegelt die Spannungen unter Einzelkern-Testlast wider; All-Core-Last und Alltag erfordern andere Spannungen;\n
· Starting from the result, raise or lower the CO of all cores based on stress tests and real use.=· Ausgehend vom Ergebnis den CO aller Kerne anhand von Stresstests und Alltagsbetrieb gemeinsam anheben oder absenken.
[Risk notice]\n=[Risikohinweis]\n
· Voltage Alignment writes CO to the CPU; too low a voltage can make the system unstable or freeze. The CO written here is lost after a restart;\n=· Der Spannungsabgleich schreibt CO an die CPU; zu geringe Spannung kann zu Instabilität oder Einfrieren führen. Der hier geschriebene CO geht nach einem Neustart verloren;\n
· The result is based on single-core measurements only and is not verified for stability; stress test it before saving;\n=· Das Ergebnis basiert nur auf Einzelkern-Messungen und ist nicht auf Stabilität geprüft; vor dem Speichern unbedingt einen Stresstest durchführen;\n
· The result is filled into the CO editor and is not saved automatically;\n=· Das Ergebnis wird in den CO-Editor eingetragen und nicht automatisch gespeichert;\n
· Undervolting and overclocking carry hardware risk; you are responsible for any data loss or hardware damage.=· Undervolting und Übertakten bergen Hardware-Risiken; für Datenverlust oder Hardwareschäden trägst du selbst die Verantwortung.
