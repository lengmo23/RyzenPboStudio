AMD Ryzen PBO Studio is an open-source tool I develop on my own in my spare time; every feature is the result of many rounds of refinement. If it saved you hours of tuning or got more performance out of your PC, feel free to buy me a coffee!\nEvery bit of support keeps me maintaining and improving it, and helps more people get a better tuning tool.=AMD Ryzen PBO Studio ist ein Open-Source-Tool, das ich allein in meiner Freizeit entwickle; jede Funktion ist das Ergebnis vieler Verbesserungsrunden. Wenn es dir Stunden beim Tuning gespart oder mehr Leistung aus deinem PC geholt hat, spendiere mir gerne einen Kaffee!\nJede Unterstützung motiviert mich, das Tool weiter zu pflegen und zu verbessern, damit noch mehr Nutzer ein besseres Tuning-Werkzeug erhalten.
Support is entirely optional and doesn't unlock anything. Thanks to everyone who uses it!=Unterstützung ist völlig freiwillig und schaltet keine zusätzlichen Funktionen frei. Danke an alle, die das Tool nutzen!
