Voltage Align=Spannungsabgleich
Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=Führt eine Einzelkern-Last auf jedem Kern aus und misst Takt / Effektivtakt / Spannung beim aktuellen CO
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=Setzt den CO aller Kerne auf den Startwert (Standard 0, anpassbar bei erhöhtem BCLK) und misst Takt und Spannung jedes Kerns; je CCD dient der CPPC-Top-Kern mit der niedrigsten Spannung bei gleichem Takt als Referenz, und CO wird schrittweise abgesenkt, um die Spannungen anzugleichen\nDanach wird CO je CCD abgesenkt, um das Einzelkern-Taktplateau zu finden, alle Kerne werden neu gemessen und langsamere Kerne feinjustiert; Kerne mit Rechenfehlern werden zurückgenommen und nicht weiter abgesenkt
Voltage Alignment=Spannungsabgleich
