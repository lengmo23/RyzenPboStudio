AMD Ryzen PBO Studio is an open-source tool I develop on my own in my spare time; every feature is the result of many rounds of refinement. If it saved you hours of tuning or got more performance out of your PC, feel free to buy me a coffee!\nEvery bit of support keeps me maintaining and improving it, and helps more people get a better tuning tool.=AMD Ryzen PBO Studio est un outil open source que je développe seul sur mon temps libre ; chaque fonctionnalité est le fruit de longues heures de mise au point. S'il vous a fait gagner du temps de réglage ou amélioré les performances de votre PC, n'hésitez pas à m'offrir un café !\nChaque soutien m'aide à le maintenir, l'améliorer et offrir un meilleur outil de réglage à tous.
Support is entirely optional and doesn't unlock anything. Thanks to everyone who uses it!=Le soutien est entièrement facultatif et ne débloque aucune fonction. Merci à tous les utilisateurs !
