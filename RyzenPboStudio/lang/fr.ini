Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=Exécute une charge monocœur sur chaque cœur et mesure sa fréquence / fréquence effective / tension au CO actuel
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=Fixe le CO de tous les cœurs à la valeur de départ (0 par défaut, ajustable si BCLK augmenté) et mesure fréquence et tension ; par CCD, le meilleur cœur CPPC à plus basse tension à fréquence égale sert de référence, puis le CO est abaissé par paliers pour aligner les tensions\nAbaisse ensuite le CO par CCD pour trouver le plateau de fréquence monocœur, remesure tous les cœurs et affine les cœurs bas ; les cœurs en erreur sont remontés et ne sont plus abaissés
