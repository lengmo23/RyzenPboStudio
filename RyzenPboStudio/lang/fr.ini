Enabling Expert mode suppresses routine test/recovery prompts and unlocks Write to BIOS.\n\n• Desktop: if the system fails to boot, clear CMOS via the motherboard jumper or CMOS battery.\n• Laptop: most laptops have no external reset button; recovering from a black screen may require disassembling the chassis to disconnect the main battery and CMOS battery. Only proceed if you can recover from a failed boot.=Le mode expert masque les invites courantes et déverrouille l'écriture dans le BIOS.\n\n• PC de bureau : en cas de non-démarrage, réinitialisez le CMOS via le cavalier ou la pile.\n• PC portable : la plupart n'ont pas de bouton de réinitialisation externe ; la récupération peut exiger de démonter le châssis pour débrancher la batterie principale et la pile CMOS.
