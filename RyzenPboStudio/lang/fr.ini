On an error, backs off the failing core's CO by one step (+{0}) and reruns the round\nuntil it passes or you stop it. If y-cruncher crashes, backs off every core in the test scope.\nCO backs off up to +{1}; the test stops at that limit.=En cas d'erreur, remonte le CO du cœur fautif d'un palier (+{0}) et relance le tour\njusqu'à réussite ou arrêt manuel. Si y-cruncher plante, remonte tous les cœurs de la portée.\nLe CO remonte jusqu'à +{1} max ; le test s'arrête à cette limite.
