Note=Remarque
[Read before starting]\n=[À lire avant de commencer]\n
· Save your documents and work and close programs you don't need. The PC may freeze during the test and unsaved data will be lost;\n=· Enregistrez vos documents et fermez les programmes inutiles. Le PC peut se figer pendant le test et toute donnée non enregistrée sera perdue ;\n
· Close browsers, games, downloaders and other background programs, and pause Windows Update, antivirus scans and other background tasks;\n=· Fermez navigateurs, jeux, téléchargeurs et autres programmes en arrière-plan, et mettez en pause Windows Update, analyses antivirus et tâches de fond ;\n
· Do not use the PC during the test. Any extra load disturbs the single-core measurement and skews the results.\n\n=· N'utilisez pas le PC pendant le test. Toute charge supplémentaire perturbe la mesure monocœur et fausse les résultats.\n\n
Voltage Alignment runs these steps automatically:\n=L'alignement de tension exécute automatiquement ces étapes :\n
1. Set every core's CO to the start CO below, CS unchanged;\n=1. Fixe le CO de tous les cœurs au CO de départ ci-dessous, CS inchangé ;\n
1. Set every core's CO to 0, CS unchanged;\n=1. Met le CO de tous les cœurs à 0, CS inchangé ;\n
2. Run Single Core Boost to record each core's frequency and voltage, and pick a reference core per CCD;\n=2. Lance Boost monocœur pour relever fréquence et tension de chaque cœur et choisir un cœur de référence par CCD ;\n
3. Voltage alignment: lower CO step by step on cores above the reference core until they converge to it (up to {0} rounds);\n=3. Alignement de tension : abaisse le CO par paliers sur les cœurs au-dessus de la référence jusqu'à convergence (jusqu'à {0} tours) ;\n
4. Frequency alignment: lower CO per CCD to find the single-core frequency plateau, re-measure all cores, then fine-tune cores that run low.\n=4. Alignement de fréquence : abaisse le CO par CCD pour trouver le plateau monocœur, remesure tous les cœurs, puis affine les cœurs les plus bas.\n
Takes up to about {0} min.=Durée maximale d'environ {0} min.
[About the result]\n=[À propos du résultat]\n
· Voltage Alignment evens out the cores' single-core voltages; it does not find each core's CO limit;\n=· L'alignement de tension harmonise les tensions monocœur des cœurs ; il ne cherche pas la limite CO de chaque cœur ;\n
· The result reflects voltages under the single-core test load; all-core load and daily use need different voltages;\n=· Le résultat reflète les tensions sous charge monocœur ; la charge tous cœurs et l'usage quotidien nécessitent d'autres tensions ;\n
· Starting from the result, raise or lower the CO of all cores based on stress tests and real use.=· À partir de ce résultat, remontez ou abaissez le CO de tous les cœurs selon les tests de stabilité et l'usage réel.
[Risk notice]\n=[Avertissement de risque]\n
· Voltage Alignment writes CO to the CPU; too low a voltage can make the system unstable or freeze. The CO written here is lost after a restart;\n=· L'alignement de tension écrit le CO dans le CPU ; une tension trop basse peut rendre le système instable ou le figer. Ce CO est perdu au redémarrage ;\n
