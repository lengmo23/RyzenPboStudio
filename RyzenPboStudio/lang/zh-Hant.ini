Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=逐核執行單核負載，測量目前 CO 下各核能跑到的頻率 / 有效頻率 / 電壓
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=全部核心 CO 統一設為起點（預設 0，偵測到外頻時可自訂）後逐核測量頻率與電壓，各 CCD 以 CPPC 最高核心中同頻電壓最低者為基準核，逐步降低 CO 對齊電壓\n再以 CCD 為單位整體降低 CO 探明單核頻率平臺，複測全部核心後微調頻率偏低的核心；出現計算錯誤的核心會回退並停止下調
Voltage Alignment=電壓對齊
