; Each line is English text=translation. Keep {0}, {1}, … placeholders and their formats (e.g. {0:F1}).
; \n is a line break and \= is a literal = in the English text. Spaces are kept as written; nothing is trimmed.
; Lines whose English text no longer appears in the program are ignored; missing lines show in English.
; If the English text starts with ; or #, write it as \; or \# so the line is not read as a comment.

