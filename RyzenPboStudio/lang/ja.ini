Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=各コアに単コア負荷をかけ、現在の CO におけるクロック / 実効クロック / 電圧を測定
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=全コアの CO を開始値（既定 0、BCLK 上昇検出時は調整可）に揃えて各コアのクロックと電圧を測定し、CCD ごとに CPPC 最上位コアのうち同クロックで最も低電圧なコアを基準に CO を段階的に下げて電圧を揃えます\n続いて CCD 単位で CO を下げて単コアのクロック上限帯を探り、全コア再測定後にクロックが低いコアを微調整します。計算エラーが出たコアは戻して引き下げを停止します
Voltage Alignment=電圧アライメント
