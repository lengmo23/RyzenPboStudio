[Read before starting]\n=【開始前に必ずお読みください】\n
· Save your documents and work and close programs you don't need. The PC may freeze during the test and unsaved data will be lost;\n=· 編集中のドキュメントや作業内容を保存し、不要なアプリを閉じてください。テスト中にフリーズして未保存データが失われる場合があります；\n
· Close browsers, games, downloaders and other background programs, and pause Windows Update, antivirus scans and other background tasks;\n=· ブラウザ、ゲーム、ダウンローダーなどのバックグラウンドアプリを閉じ、Windows Update やウイルス対策スキャンなどの常駐タスクを一時停止してください；\n
· Do not use the PC during the test. Any extra load disturbs the single-core measurement and skews the results.\n\n=· テスト中は PC を操作しないでください。余分な負荷がかかると単コア測定が乱れ、結果が歪みます。\n\n
Voltage Alignment runs these steps automatically:\n=電圧アライメントは以下の手順を自動実行します：\n
1. Set every core's CO to the start CO below, CS unchanged;\n=1. 全コアの CO を下の開始 CO に揃え、CS は変更しない；\n
1. Set every core's CO to 0, CS unchanged;\n=1. 全コアの CO を 0 にリセットし、CS は変更しない；\n
2. Run Single Core Boost to record each core's frequency and voltage, and pick a reference core per CCD;\n=2. 単コア測定を実行して各コアのクロックと電圧を記録し、CCD ごとに基準コアを選定；\n
3. Voltage alignment: lower CO step by step on cores above the reference core until they converge to it (up to {0} rounds);\n=3. 電圧アライメント：基準コアより高電圧なコアの CO を段階的に下げて基準コアへ収束させる（最大 {0} ラウンド）；\n
4. Frequency alignment: lower CO per CCD to find the single-core frequency plateau, re-measure all cores, then fine-tune cores that run low.\n=4. クロックアライメント：CCD 単位で CO を下げて単コアのクロック上限帯を探り、全コア再測定後にクロックの低いコアを個別に微調整。\n
Takes up to about {0} min.=最大所要時間の目安：約 {0} 分。
[About the result]\n=【結果について】\n
· Voltage Alignment evens out the cores' single-core voltages; it does not find each core's CO limit;\n=· 電圧アライメントは単コア負荷時の各コア電圧を揃える処理であり、各コアの限界 CO を探すものではありません；\n
· The result reflects voltages under the single-core test load; all-core load and daily use need different voltages;\n=· 結果は単コア測定負荷での電圧に基づきます。全コア負荷や日常使用で必要な電圧は異なります；\n
· Starting from the result, raise or lower the CO of all cores based on stress tests and real use.=· この結果をベースに、ストレステストと実使用の状況に応じて全コアの CO を一括で増減調整してください。
[Risk notice]\n=【リスクに関する注意】\n
· Voltage Alignment writes CO to the CPU; too low a voltage can make the system unstable or freeze. The CO written here is lost after a restart;\n=· 電圧アライメントでは CPU に CO を書き込みます。電圧が低すぎると不安定化やフリーズの原因になります。ここで書き込んだ CO は再起動すると元に戻ります；\n
· The result is based on single-core measurements only and is not verified for stability; stress test it before saving;\n=· 結果は単コア負荷の測定のみに基づいており安定性は未検証です。保存して使用する前に必ずストレステストを実施してください；\n
· The result is filled into the CO editor and is not saved automatically;\n=· 結果は CO エディタに入力され、自動保存はされません；\n
· Undervolting and overclocking carry hardware risk; you are responsible for any data loss or hardware damage.=· 低電圧化やオーバークロックにはハードウェアリスクが伴います。データ損失やハードウェア破損は自己責任となります。
\n\nNote: an interrupted stress test was found. When a test starts later, it continues from this result with every core backed off by {0} steps.=\n\n注意：前回のストレステストの中断ポイントが検出されました。次回テストを開始すると、今回のアライメント結果から全コアを一括で {0} 戻した値で続行します。
Core BCLK is {0:F2} MHz. With a raised BCLK some cores may need a positive CO to be stable, so enter a start CO: alignment starts with every core at this value and never ends above it; with a start above 0 each step lowers CO by at most {1}. The default is the highest positive CO now in effect.=コア BCLK {0:F2} MHz を検出しました。BCLK を上げると安定動作に正の CO が必要なコアが出るため、開始 CO を指定してください。全コアをこの値に揃えて開始し、結果がこの値を上回ることはありません。開始値が 0 より大きい場合、1 回の下げ幅上限は {1} になります。既定値は現在適用中の正の CO の最大値です。
