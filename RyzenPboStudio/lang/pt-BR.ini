Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=Aplica carga single-core em cada núcleo e mede frequência / frequência efetiva / tensão no CO atual
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=Define o CO de todos os núcleos no valor inicial (0 por padrão, ajustável ao detectar BCLK elevado) e mede frequência e tensão de cada núcleo; em cada CCD, o núcleo de maior CPPC com menor tensão na mesma frequência é a referência, e o CO é reduzido passo a passo para alinhar as tensões\nDepois reduz o CO por CCD para encontrar o patamar de frequência single-core, remede todos os núcleos e faz ajuste fino nos que ficarem abaixo; núcleos com erro de cálculo recuam e deixam de ser reduzidos
