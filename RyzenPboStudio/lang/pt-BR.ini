Note=Nota
[Read before starting]\n=[Leia antes de começar]\n
· Save your documents and work and close programs you don't need. The PC may freeze during the test and unsaved data will be lost;\n=· Salve seus documentos e trabalhos e feche programas desnecessários. O PC pode travar durante o teste e dados não salvos serão perdidos;\n
· Close browsers, games, downloaders and other background programs, and pause Windows Update, antivirus scans and other background tasks;\n=· Feche navegadores, jogos, gerenciadores de download e outros apps em segundo plano, e pause o Windows Update, antivírus e tarefas em segundo plano;\n
· Do not use the PC during the test. Any extra load disturbs the single-core measurement and skews the results.\n\n=· Não use o PC durante o teste. Qualquer carga extra interfere na medição single-core e distorce os resultados.\n\n
Voltage Alignment runs these steps automatically:\n=O Alinhamento de tensão executa estas etapas automaticamente:\n
1. Set every core's CO to the start CO below, CS unchanged;\n=1. Define o CO de todos os núcleos para o CO inicial abaixo, mantendo o CS inalterado;\n
1. Set every core's CO to 0, CS unchanged;\n=1. Define o CO de todos os núcleos para 0, mantendo o CS inalterado;\n
2. Run Single Core Boost to record each core's frequency and voltage, and pick a reference core per CCD;\n=2. Executa o Boost single-core para registrar frequência e tensão de cada núcleo e escolher um núcleo de referência por CCD;\n
3. Voltage alignment: lower CO step by step on cores above the reference core until they converge to it (up to {0} rounds);\n=3. Alinhamento de tensão: reduz o CO passo a passo nos núcleos acima da referência até convergirem (até {0} rodadas);\n
4. Frequency alignment: lower CO per CCD to find the single-core frequency plateau, re-measure all cores, then fine-tune cores that run low.\n=4. Alinhamento de frequência: reduz o CO por CCD para achar o patamar de frequência single-core, remede todos os núcleos e faz ajuste fino nos mais baixos.\n
Takes up to about {0} min.=Leva no máximo cerca de {0} min.
[About the result]\n=[Sobre o resultado]\n
· Voltage Alignment evens out the cores' single-core voltages; it does not find each core's CO limit;\n=· O Alinhamento de tensão equaliza as tensões single-core dos núcleos; ele não encontra o limite de CO de cada núcleo;\n
· The result reflects voltages under the single-core test load; all-core load and daily use need different voltages;\n=· O resultado reflete tensões sob carga single-core de teste; carga total e uso diário exigem tensões diferentes;\n
· Starting from the result, raise or lower the CO of all cores based on stress tests and real use.=· A partir do resultado, aumente ou reduza o CO de todos os núcleos conforme os testes de estresse e o uso real.
[Risk notice]\n=[Aviso de risco]\n
· Voltage Alignment writes CO to the CPU; too low a voltage can make the system unstable or freeze. The CO written here is lost after a restart;\n=· O Alinhamento de tensão grava CO na CPU; tensão baixa demais pode causar instabilidade ou travamento. O CO gravado aqui é perdido ao reiniciar;\n
· The result is based on single-core measurements only and is not verified for stability; stress test it before saving;\n=· O resultado baseia-se apenas em medições single-core e não tem estabilidade comprovada; faça teste de estresse antes de salvar;\n
· The result is filled into the CO editor and is not saved automatically;\n=· O resultado é preenchido no editor de CO e não é salvo automaticamente;\n
· Undervolting and overclocking carry hardware risk; you are responsible for any data loss or hardware damage.=· Undervolt e overclock envolvem riscos ao hardware; você é responsável por qualquer perda de dados ou dano ao hardware.
\n\nNote: an interrupted stress test was found. When a test starts later, it continues from this result with every core backed off by {0} steps.=\n\nObservação: há um teste de estresse interrompido. Ao iniciar o teste depois, ele continuará a partir deste resultado com todos os núcleos recuados em {0} passos.
Core BCLK is {0:F2} MHz. With a raised BCLK some cores may need a positive CO to be stable, so enter a start CO: alignment starts with every core at this value and never ends above it; with a start above 0 each step lowers CO by at most {1}. The default is the highest positive CO now in effect.=O BCLK dos núcleos é {0:F2} MHz. Com BCLK elevado, alguns núcleos podem precisar de CO positivo para estabilidade; informe o CO inicial: o alinhamento parte desse valor em todos os núcleos e nunca termina acima dele; com início acima de 0, cada passo reduz o CO em no máximo {1}. O padrão é o maior CO positivo em vigor.
