AMD Ryzen PBO Studio is an open-source tool I develop on my own in my spare time; every feature is the result of many rounds of refinement. If it saved you hours of tuning or got more performance out of your PC, feel free to buy me a coffee!\nEvery bit of support keeps me maintaining and improving it, and helps more people get a better tuning tool.=AMD Ryzen PBO Studio é uma ferramenta open-source que desenvolvo sozinho no meu tempo livre; cada recurso é fruto de várias rodadas de refinamento. Se ela poupou horas de ajuste ou extraiu mais desempenho do seu PC, sinta-se à vontade para me pagar um café!\nCada apoio me ajuda a mantê-la e aprimorá-la, levando uma ferramenta melhor para mais pessoas.
