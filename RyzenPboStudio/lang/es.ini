AMD Ryzen PBO Studio is an open-source tool I develop on my own in my spare time; every feature is the result of many rounds of refinement. If it saved you hours of tuning or got more performance out of your PC, feel free to buy me a coffee!\nEvery bit of support keeps me maintaining and improving it, and helps more people get a better tuning tool.=AMD Ryzen PBO Studio es una herramienta de código abierto que desarrollo por mi cuenta en mi tiempo libre; cada función es fruto de muchas rondas de perfeccionamiento. Si te ahorró horas de ajuste o sacó más rendimiento de tu PC, ¡puedes invitarme un café!\nCada muestra de apoyo me ayuda a seguir manteniéndola y mejorándola para toda la comunidad.
