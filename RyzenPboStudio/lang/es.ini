Enabling Expert mode suppresses routine test/recovery prompts and unlocks Write to BIOS.\n\n• Desktop: if the system fails to boot, clear CMOS via the motherboard jumper or CMOS battery.\n• Laptop: most laptops have no external reset button; recovering from a black screen may require disassembling the chassis to disconnect the main battery and CMOS battery. Only proceed if you can recover from a failed boot.=Al activar el modo experto se omiten los avisos habituales y se desbloquea Escribir en BIOS.\n\n• Sobremesa: si no arranca, limpia el CMOS con el puente o la pila de la placa.\n• Portátil: la mayoría no tiene botón de reinicio externo; recuperar una pantalla negra puede exigir abrir el equipo y desconectar la batería principal y la pila CMOS.
