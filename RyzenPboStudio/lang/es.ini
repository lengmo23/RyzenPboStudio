[Read before starting]\n=[Leer antes de empezar]\n
· Save your documents and work and close programs you don't need. The PC may freeze during the test and unsaved data will be lost;\n=· Guarda tus documentos y cierra los programas que no necesites. El PC podría congelarse durante la prueba y se perderían los datos sin guardar;\n
· Close browsers, games, downloaders and other background programs, and pause Windows Update, antivirus scans and other background tasks;\n=· Cierra navegadores, juegos, gestores de descargas y demás programas en segundo plano, y pausa Windows Update, análisis antivirus y otras tareas en segundo plano;\n
· Do not use the PC during the test. Any extra load disturbs the single-core measurement and skews the results.\n\n=· No uses el PC durante la prueba. Cualquier carga adicional altera la medición mononúcleo y distorsiona los resultados.\n\n
Voltage Alignment runs these steps automatically:\n=La alineación de voltaje ejecuta estos pasos automáticamente:\n
1. Set every core's CO to the start CO below, CS unchanged;\n=1. Establecer el CO de todos los núcleos en el CO inicial indicado abajo, sin cambiar CS;\n
1. Set every core's CO to 0, CS unchanged;\n=1. Establecer el CO de todos los núcleos en 0, sin cambiar CS;\n
2. Run Single Core Boost to record each core's frequency and voltage, and pick a reference core per CCD;\n=2. Ejecutar Boost mononúcleo para registrar la frecuencia y el voltaje de cada núcleo y elegir un núcleo de referencia por CCD;\n
3. Voltage alignment: lower CO step by step on cores above the reference core until they converge to it (up to {0} rounds);\n=3. Alineación de voltaje: reducir el CO paso a paso en los núcleos con voltaje superior al de referencia hasta converger con él (hasta {0} rondas);\n
4. Frequency alignment: lower CO per CCD to find the single-core frequency plateau, re-measure all cores, then fine-tune cores that run low.\n=4. Alineación de frecuencia: reducir el CO por CCD para hallar la meseta de frecuencia mononúcleo, volver a medir todos los núcleos y ajustar los que queden bajos.\n
Takes up to about {0} min.=Puede tardar hasta unos {0} min.
[About the result]\n=[Sobre el resultado]\n
· Voltage Alignment evens out the cores' single-core voltages; it does not find each core's CO limit;\n=· La alineación de voltaje equilibra los voltajes mononúcleo entre núcleos; no busca el límite de CO de cada núcleo;\n
· The result reflects voltages under the single-core test load; all-core load and daily use need different voltages;\n=· El resultado refleja voltajes bajo carga de prueba mononúcleo; la carga multinúcleo y el uso diario requieren voltajes distintos;\n
· Starting from the result, raise or lower the CO of all cores based on stress tests and real use.=· A partir de este resultado, sube o baja el CO de todos los núcleos según las pruebas de estrés y el uso real.
[Risk notice]\n=[Aviso de riesgo]\n
· Voltage Alignment writes CO to the CPU; too low a voltage can make the system unstable or freeze. The CO written here is lost after a restart;\n=· La alineación de voltaje escribe CO en la CPU; un voltaje demasiado bajo puede volver inestable el sistema o congelarlo. El CO escrito aquí se pierde al reiniciar;\n
· The result is based on single-core measurements only and is not verified for stability; stress test it before saving;\n=· El resultado se basa solo en mediciones mononúcleo y no está verificado; realiza pruebas de estrés antes de guardarlo;\n
· The result is filled into the CO editor and is not saved automatically;\n=· El resultado se rellena en el editor de CO y no se guarda automáticamente;\n
