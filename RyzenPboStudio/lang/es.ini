Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=Ejecuta una carga mononúcleo en cada núcleo y mide su frecuencia / frecuencia efectiva / voltaje con el CO actual
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=Establece el CO de todos los núcleos al valor inicial (0 por defecto, ajustable si se detecta un BCLK elevado) y mide frecuencia y voltaje de cada núcleo; por CCD, el núcleo superior CPPC con menor voltaje a la misma frecuencia actúa como referencia y el CO se reduce paso a paso para alinear voltajes\nLuego reduce el CO por CCD para hallar la meseta de frecuencia mononúcleo, vuelve a medir todos los núcleos y ajusta los que quedan bajos; los núcleos con errores de cálculo retroceden y dejan de reducirse
