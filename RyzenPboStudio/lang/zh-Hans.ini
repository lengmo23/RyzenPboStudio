Runs a single-core load on each core and measures its frequency / effective frequency / voltage at the current CO=逐核运行单核负载，测量当前 CO 下各核能跑到的频率 / 有效频率 / 电压
Sets every core's CO to the start value (0 by default, adjustable when a raised BCLK is detected) and measures each core's frequency and voltage; per CCD, the CPPC-top core with the lowest voltage at the same frequency is the reference, and CO is lowered step by step to align voltages\nThen lowers CO per CCD to find the single-core frequency plateau, re-measures all cores and fine-tunes cores that run low; cores with computation errors are backed off and no longer lowered=全部核心 CO 统一设为起点（默认 0，检测到外频时可自定义）后逐核测量频率与电压，各 CCD 以 CPPC 最高核心中同频电压最低者为基准核，逐步降低 CO 对齐电压\n再以 CCD 为单位整体降低 CO 探明单核频率平台，复测全部核心后微调频率偏低的核心；出现计算错误的核心会回退并停止下调
Voltage Alignment=电压对齐
